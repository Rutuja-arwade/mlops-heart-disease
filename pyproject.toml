[project]
name = "heart-disease-mlops"
version = "1.0.0"
requires-python = ">=3.10"

[tool.ruff]
line-length = 200
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E9", "F"]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
